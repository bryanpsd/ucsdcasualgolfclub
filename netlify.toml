[build]
  command = "pnpm run build"
  publish = "dist"

# Uncomment and add more as needed
# [[headers]]
#   for = "/private/*"
#   [headers.values]
#     X-Robots-Tag = "noindex"
# [[headers]]
#   for = "/some-page.html"
#   [headers.values]
#     X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    # 'unsafe-inline' is required for script-src and style-src because Astro's is:inline
    # directive and Google Analytics inject inline scripts/styles at build time.
    # Nonces are not viable with Netlify's static headers. All allowed external hosts
    # are explicitly enumerated to limit the blast radius of any XSS that does occur.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://maps.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.ctfassets.net https://maps.googleapis.com https://maps.gstatic.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googleapis.com https://cdn.contentful.com; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[context.production]
  # Ensure production explicitly serves the robots header. Keeps previews/branch deploys free to override.
  [[headers]]
    for = "/*"
    [headers.values]
      X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"

# Example: explicit noindex for a style guide route (page not present now; keep commented or enable if you add the page)
# [[headers]]
#   for = "/style-guide"
#   [headers.values]
#     X-Robots-Tag = "noindex"

# Static asset caching with compression
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

